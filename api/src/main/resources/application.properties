# ==========================================
# CONFIGURAÇÕES DO SERVIDOR
# ==========================================
server.port=8080

# ==========================================
# CONFIGURAÇÕES DO BANCO DE DADOS H2
# ==========================================
spring.datasource.url=jdbc:h2:mem:marketplacedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ==========================================
# 'update' cria as tabelas se não existirem e atualiza colunas novas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no terminal do VS Code (Ótimo para debugar)
spring.jpa.show-sql=true

# Formata o SQL no terminal para ficar legível
spring.jpa.properties.hibernate.format_sql=true

# Resolve avisos de inicialização do JPA com o H2
spring.jpa.defer-datasource-initialization=true