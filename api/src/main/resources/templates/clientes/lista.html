<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: headBase}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <div class="container mt-4">
        <h2 style="color: #611212;">Gestão de Clientes</h2>
        <hr>
        
        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <a href="/clientes/novo" class="btn btn-primary-custom mb-4">+ Novo Cliente</a>

        <div th:if="${#lists.isEmpty(clientes)}" class="alert alert-warning">
            Nenhum cliente cadastrado no sistema.
        </div>

        <table th:unless="${#lists.isEmpty(clientes)}" class="table table-custom table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Endereço</th>
                    <th>Ações</th> </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td th:text="${cliente.nome}"></td>
                    <td th:text="${cliente.email}"></td>
                    <td th:text="${cliente.endereco}"></td>
                    <td>
                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-warning">Editar</a>
                        
                        <a th:href="@{/clientes/excluir/{id}(id=${cliente.id})}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Tem certeza que deseja excluir este cliente?');">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: rodape}"></div>
</body>
</html>
