<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: headBase}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <div class="container mt-4">
        <h2 style="color: #611212;">Catálogo de Produtos</h2>
        <hr>
        
        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <a href="/produtos/novo" class="btn btn-primary-custom mb-4">+ Novo Produto</a>

        <div th:if="${#lists.isEmpty(produtos)}" class="alert alert-warning">
            Nenhum produto cadastrado ainda.
        </div>

        <table th:unless="${#lists.isEmpty(produtos)}" class="table table-custom table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço (R$)</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.produtoId}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.preco}"></td>
                    <td th:text="${produto.estoque}"></td>
                    <td>
                        <a th:href="@{/produtos/editar/{id}(id=${produto.produtoId})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/produtos/excluir/{id}(id=${produto.produtoId})}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: rodape}"></div>
</body>
</html>
